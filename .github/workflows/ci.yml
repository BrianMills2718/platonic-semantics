name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      # Feeds the analysis pure random geometry and fails if it reports a
      # result. This is the check the pilot did not have.
      - run: pytest tests/ -q
